<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="450" viewBox="0 0 1440 450" role="img"><title>From a source to the essentials</title><desc>Share a URL or image, retrieve available evidence, choose one analytical prompt, and receive essential ideas with uncertainty stated.</desc><style>text{font-family:Arial,Helvetica,sans-serif}</style><rect width="1440" height="450" rx="28" fill="#0b1323"/><text x="54" y="65" fill="#78e3bf" font-size="18" font-weight="700">FROM A LINK TO THE ESSENTIALS</text><text x="54" y="112" fill="#f2f6fb" font-size="32" font-weight="700">One source. A chosen perspective. A clearer answer.</text><rect x="54" y="160" width="316" height="195" rx="18" fill="#131f34" stroke="#2a3c55"/><text x="76" y="199" fill="#78e3bf" font-size="19" font-weight="700">01</text><text x="76" y="239" fill="#f2f6fb" font-size="24" font-weight="700">SHARE</text><text x="76" y="280" fill="#e8eff7" font-size="21" font-weight="400">A URL or an image</text><text x="76" y="316" fill="#a8b8cd" font-size="15" font-weight="400">Article, video, post, chart</text><path d="M 375 257 h 12 m -5 -5 l 5 5 -5 5" fill="none" stroke="#78e3bf" stroke-width="2"/><rect x="392" y="160" width="316" height="195" rx="18" fill="#131f34" stroke="#2a3c55"/><text x="414" y="199" fill="#78e3bf" font-size="19" font-weight="700">02</text><text x="414" y="239" fill="#f2f6fb" font-size="24" font-weight="700">RETRIEVE</text><text x="414" y="280" fill="#e8eff7" font-size="21" font-weight="400">Available evidence</text><text x="414" y="316" fill="#a8b8cd" font-size="15" font-weight="400">Text, captions, inspected images</text><path d="M 713 257 h 12 m -5 -5 l 5 5 -5 5" fill="none" stroke="#78e3bf" stroke-width="2"/><rect x="730" y="160" width="316" height="195" rx="18" fill="#131f34" stroke="#2a3c55"/><text x="752" y="199" fill="#78e3bf" font-size="19" font-weight="700">03</text><text x="752" y="239" fill="#f2f6fb" font-size="24" font-weight="700">CHOOSE</text><text x="752" y="280" fill="#e8eff7" font-size="21" font-weight="400">One behavioral prompt</text><text x="752" y="316" fill="#a8b8cd" font-size="15" font-weight="400">Essence, antithesis, evidence audit</text><path d="M 1051 257 h 12 m -5 -5 l 5 5 -5 5" fill="none" stroke="#78e3bf" stroke-width="2"/><rect x="1068" y="160" width="316" height="195" rx="18" fill="#131f34" stroke="#2a3c55"/><text x="1090" y="199" fill="#78e3bf" font-size="19" font-weight="700">04</text><text x="1090" y="239" fill="#f2f6fb" font-size="24" font-weight="700">KEEP</text><text x="1090" y="280" fill="#e8eff7" font-size="21" font-weight="400">What matters</text><text x="1090" y="316" fill="#a8b8cd" font-size="15" font-weight="400">Core ideas, gaps, a useful verdict</text><text x="54" y="408" fill="#b5c4d8" font-size="19" font-weight="400">Coverage comes first: a title, caption, or thumbnail is not the whole video.</text></svg>