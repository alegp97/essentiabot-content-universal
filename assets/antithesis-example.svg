<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img"><title>Antithesis in action — illustrative example</title><desc>A fictional claim that all meetings should be eliminated is tested against coordination costs. The narrower conclusion is to trial selective reductions.</desc><style>text{font-family:Arial,Helvetica,sans-serif}</style><rect width="1200" height="760" rx="28" fill="#0b1323"/><text x="48" y="52" fill="#78e3bf" font-size="18" font-weight="700">ESSENTIABOT  /  ANTITHESIS</text><text x="48" y="86" fill="#a8b8cd" font-size="17" font-weight="400">Illustrative example · fictional source · not a live extraction</text><rect x="360" y="117" width="792" height="99" rx="18" fill="#1b3c66"/><text x="387" y="156" fill="#f2f6fb" font-size="21" font-weight="700">Apply antithesis to this claim:</text><text x="387" y="189" fill="#e8eff7" font-size="22" font-weight="400">“Every company should eliminate every meeting.”</text><text x="48" y="262" fill="#b5c4d8" font-size="19" font-weight="400">Coverage: user-provided excerpt only. No study data supplied.</text><rect x="48" y="290" width="1104" height="90" rx="14" fill="#131f34"/><text x="72" y="321" fill="#78e3bf" font-size="16" font-weight="700">THESIS</text><text x="72" y="356" fill="#e8eff7" font-size="25" font-weight="400">Fewer meetings may recover individual work time.</text><rect x="48" y="397" width="1104" height="90" rx="14" fill="#131f34"/><text x="72" y="428" fill="#f5be72" font-size="16" font-weight="700">ANTITHESIS</text><text x="72" y="463" fill="#e8eff7" font-size="25" font-weight="400">Some meetings prevent costly coordination failures.</text><rect x="48" y="504" width="1104" height="90" rx="14" fill="#131f34"/><text x="72" y="535" fill="#78e3bf" font-size="16" font-weight="700">WHAT SURVIVES</text><text x="72" y="570" fill="#e8eff7" font-size="25" font-weight="400">Trial selective reductions; measure quality and rework.</text><text x="48" y="649" fill="#d4deeb" font-size="21" font-weight="400">One team. One week. More tickets. That does not establish a universal rule.</text><text x="48" y="705" fill="#a8b8cd" font-size="17" font-weight="400">Prompt: antithesis (v1)   •   Evidence citation: supplied fictional excerpt</text></svg>